[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-analysis"
version = "0.1.0"
description = "Scientific toolkit for gravitational wave data analysis using GWOSC and gwpy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "gwpy>=3.0",
  "astropy>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gw_analysis*"]

[tool.ruff]
line-length = 100
target-version = "py310"
